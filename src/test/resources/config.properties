############# general ##############
useGrid=false
threads=1

############ browsers ##############
#chrome, firefox, edge
browser=chrome

############## URL's ################
baseUrlPrestaShop=http://localhost:8090

############ Playwright PrestaShop ############
# Comma-separated values. Supported browsers: chromium, firefox, webkit.
pwBrowsers=chromium
# desktop_2560x1600, desktop_1920x1200, mobile_landscape, mobile,
# tablet_landscape, tablet
pwProfiles=desktop_1920x1200
retries=1
# Attach explicit screenshots to Allure on all attempts when true. Failed and
# retry attempts always retain screenshots, videos, and traces.
allureScreenshots=false
headless=true

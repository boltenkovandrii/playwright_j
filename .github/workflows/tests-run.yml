name: Run tests with Selenium Grid

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tag to include'
        required: true
        default: 'regression'
      browsers:
        description: 'Comma or space-separated list of browsers. Available browsers: chromium, firefox, webkit. If empty, defaults applied.'
        required: false
      profiles:
        description: 'Comma or space-separated list of profiles. Available profiles: tablet, mobile, desktop_2560x1600, desktop_1920x1200, mobile_landscape and tablet_landscape. If empty, defaults applied.'
        required: false
      threads:
        description: 'Number of parallel threads to run'
        required: true
        default: '2'

  push:
    branches:
      - main
      - "feature/**"

  schedule:
    - cron: '3 4 1 * *' # run on the first of every month at 04:03 UTC


jobs:

  run-tests:
    name: Run Gradle tests and collect reports

    runs-on: ubuntu-latest

    env:
      BROWSERS: ${{ github.event.inputs.browsers || 'chromium' }}
      PROFILES: ${{ github.event.inputs.profiles || 'desktop_1920x1200' }}
      THREADS: ${{ github.event.inputs.threads || 2 }}
      TAGS: ${{ github.event.inputs.tags || 'regression' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Docker Compose
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker-compose

      - name: Start app
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          docker compose -f docker/docker-compose-prestashop.yml up -d      

      - name: Set up Gradle wrapper permissions
        run: |
          chmod +x gradlew

      - name: Run checkstyle and pmd checks
        run: |
          ./gradlew qualityCheck

      - name: Run Gradle tests
        run: |
          ./gradlew -Dbrowsers=$BROWSERS -Dprofiles=$PROFILES -Dthreads=$THREADS -DincludeTags=$TAGS clean test

      - name: Tear down
        if: always()
        run: |
          docker compose down || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport
          retention-days: 3
          if-no-files-found: warn
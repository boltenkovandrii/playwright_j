name: Run tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tag to include'
        required: true
        default: 'regression'
      browsers:
        description: 'Comma or space-separated list of browsers. Available browsers: chromium, firefox, webkit. If empty, defaults applied.'
        required: false
      profiles:
        description: 'Comma or space-separated list of profiles. Available profiles: tablet, mobile, desktop_2560x1600, desktop_1920x1200, mobile_landscape and tablet_landscape. If empty, defaults applied.'
        required: false
      threads:
        description: 'Number of parallel threads to run'
        required: true
        default: '2'

  # Having both 'push' and 'pull_request' is probably excessive but for a sample project it is ok.
  # Commit to existing PR will trigger both events, but the PR event will run on a temporary commit based on main and current branch, so both have value.
  # Runs on current branch
  push:
    branches:
      - main
      - "feature/**"

  # Runs on temporary commit based on main and current branch - actually testing results after the merge.
  pull_request:
    branches:
      - main

  schedule:
    - cron: '3 4 1 * *' # run on the first of every month at 04:03 UTC


jobs:

  run-tests:
    name: Run Gradle tests and collect reports

    runs-on: ubuntu-latest

    env:
      DEFAULT_BROWSERS: chromium
      DEFAULT_PROFILES: desktop_1920x1200
      FULL_BROWSERS: chromium,webkit,firefox
      FULL_PROFILES: tablet,mobile,desktop_2560x1600,desktop_1920x1200,mobile_landscape,tablet_landscape
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_BROWSERS: ${{ github.event.inputs.browsers }}
      INPUT_PROFILES: ${{ github.event.inputs.profiles }}
      THREADS: ${{ github.event.inputs.threads || 2 }}
      TAGS: ${{ github.event.inputs.tags || 'regression' }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve test parameters
        shell: bash
        run: |
          normalize_list() {
            printf '%s' "$1" |
              tr ',[:space:]' '\n' |
              awk 'NF {
                if (count++) printf ","
                printf "%s", $0
              }'
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BROWSERS=$(normalize_list "$INPUT_BROWSERS")
            PROFILES=$(normalize_list "$INPUT_PROFILES")

            BROWSERS="${BROWSERS:-$DEFAULT_BROWSERS}"
            PROFILES="${PROFILES:-$DEFAULT_PROFILES}"

          elif [[ "$EVENT_NAME" == "schedule" || "$REF_NAME" == "main" ]]; then
            BROWSERS="$FULL_BROWSERS"
            PROFILES="$FULL_PROFILES"

          else
            BROWSERS="$DEFAULT_BROWSERS"
            PROFILES="$DEFAULT_PROFILES"
          fi

          echo "BROWSERS=$BROWSERS" >> "$GITHUB_ENV"
          echo "PROFILES=$PROFILES" >> "$GITHUB_ENV"

          echo "Resolved browsers: $BROWSERS"
          echo "Resolved profiles: $PROFILES"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Docker Compose
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker-compose

      - name: Start app
#        env:
#          REPO_OWNER: ${{ github.repository_owner }}
#          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          docker compose -f docker/docker-compose-prestashop.yml up -d      

      - name: Wait for PrestaShop
        run: |
          for i in {1..60}; do
          if curl --fail --silent http://localhost:8080/ > /dev/null; then
           echo "PrestaShop is ready"
           exit 0
          fi
          sleep 5
          done
          
          echo "PrestaShop did not become ready"
          docker compose -f docker/docker-compose-prestashop.yml logs
          exit 1

      - name: Set up Gradle wrapper permissions
        run: |
          chmod +x gradlew

      # TODO: uncomment
#      - name: Run checkstyle and pmd checks
#        run: |
#          ./gradlew qualityCheck

      - name: Install Playwright system dependencies
        run: ./gradlew installPlaywrightDeps

      - name: Run Gradle tests
        shell: bash
        run: |
          command=(./gradlew clean test -Dbrowsers="$BROWSERS" -Dprofiles="$PROFILES" -Dthreads="$THREADS" -DincludeTags="$TAGS")

          echo "Running Gradle with:"
          printf '  %s\n' "${command[@]}"

          "${command[@]}"

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker/docker-compose-prestashop.yml down

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport
          retention-days: 3
          if-no-files-found: warn